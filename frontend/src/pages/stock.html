<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock levels · Batloung Farm DMS</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-page="stock">
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Stock levels</h1>
          <p class="subtitle">Boxes available for each fruit and packaging size</p>
        </div>
        <div class="topbar-actions"><a class="btn btn-primary" href="purchases.html?new=1">+ Restock (record purchase)</a></div>
      </header>
      <section class="card" style="margin-bottom:20px">
        <div id="sizeSummary" class="size-summary"></div>
      </section>
      <section class="card">
        <div class="card-header">
          <div class="filters"><select id="sizeFilter" aria-label="Packaging size">
              <option value="">All packaging sizes</option><option value="SMALL">Small</option><option value="MEDIUM">Medium</option><option value="LARGE">Large</option>
            </select>
            <label class="check"><input type="checkbox" id="lowOnly"> Low stock only</label>
            <span id="thresholdWrap" class="hidden"><input id="threshold" type="number" min="0" step="1" placeholder="Threshold (blank = reorder level)" aria-label="Low stock threshold" style="min-width:250px"></span></div>
          <span class="muted small" id="count"></span>
        </div>
        <div id="table"></div>
      </section>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../components/toast.js"></script>
  <script src="../components/modal.js"></script>
  <script src="../components/table.js"></script>
  <script src="../components/lineItems.js"></script>
  <script src="../components/sidebar.js"></script>
  <script src="../js/pages/stock.js"></script>
</body>
</html>
